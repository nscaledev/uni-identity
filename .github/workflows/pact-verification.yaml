name: Pact Provider Verification

# Triggered when a consumer publishes a pact that needs verifying. With client_payload.provider_version
# set, it verifies that deployed provider commit instead of main, as Pact's
# contract_requiring_verification_published flow does for each deployed provider version
# (https://docs.pact.io/pact_broker/webhooks#the-contract-requiring-verification-published-event), so
# can-i-deploy --to-environment staging|production has a result for the provider that environment runs.
# Without it, the run verifies main as before.
on:
  repository_dispatch:
    types: [pact_verification]

permissions:
  contents: read

jobs:
  verify-pacts:
    runs-on: ubuntu-latest
    steps:
    - name: Log webhook payload
      run: |
        echo "Triggered by consumer: ${{ github.event.client_payload.consumer_name }}"
        echo "Pact URL: ${{ github.event.client_payload.pact_url }}"
        echo "Provider version to verify: ${{ github.event.client_payload.provider_version }}"
        echo "Provider branch: ${{ github.event.client_payload.provider_branch }}"

    - name: Checkout
      uses: actions/checkout@v4
      with:
        # Checkout the provider branch/version specified by the webhook. A deployed provider_version is
        # validated and checked out by the next step, from main's own copy of the script.
        ref: ${{ github.event.client_payload.provider_version != '' && 'main' || github.event.client_payload.provider_branch || 'main' }}
        # '0' as a string: a numeric 0 is falsy in an expression, so `&& 0 || 1` always gave 1 and the
        # checkout lacked the history the ancestry check needs.
        fetch-depth: ${{ github.event.client_payload.provider_version != '' && '0' || '1' }}

    # Only a full commit already on origin/main is accepted, so the payload can't point the run at any
    # other ref. The old commit then runs its own provider state handlers: a pact that needs a state
    # added since fails here, and that failure is the correct "can't deploy" answer for that version.
    - name: Check out the deployed provider version
      id: deployed
      if: ${{ github.event.client_payload.provider_version != '' }}
      env:
        REQUESTED: ${{ github.event.client_payload.provider_version }}
      run: |
        version="$(hack/pact/provider-version.sh "$REQUESTED")"
        git checkout --quiet --detach "$version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Install Pact FFI Library
      run: |
        ARCH=$(uname -m)
        if [ "$ARCH" = "x86_64" ]; then
          PACT_ARCH="x86_64"
        elif [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
          PACT_ARCH="aarch64"
        else
          echo "Unsupported architecture: $ARCH"
          exit 1
        fi
        wget https://github.com/pact-foundation/pact-reference/releases/download/libpact_ffi-v0.4.28/libpact_ffi-linux-${PACT_ARCH}.so.gz
        gunzip libpact_ffi-linux-${PACT_ARCH}.so.gz
        sudo mkdir -p /usr/local/lib
        sudo mv libpact_ffi-linux-${PACT_ARCH}.so /usr/local/lib/libpact_ffi.so
        sudo ldconfig

    - name: Setup kind cluster
      uses: helm/kind-action@v1
      with:
        cluster_name: contract-testing

    - name: Install CRDs
      run: |
        make charts/identity/crds
        kubectl apply -f charts/identity/crds/

    - name: Get Deployed Provider Version
      id: get_version
      if: ${{ github.event.client_payload.provider_version == '' }}
      run: |
        OUTPUT=$(docker run --rm \
          --network host \
          pactfoundation/pact-cli:latest \
          pact-broker describe-version \
          --pacticipant="uni-identity" \
          --latest="main" \
          --broker-base-url="${{ vars.PACT_BROKER_URL_DEV }}" \
          --broker-username="${{ vars.PACT_BROKER_USERNAME }}" \
          --broker-password="${{ secrets.PACT_BROKER_PASSWORD }}" \
          --output=json)

        VERSION=$(echo "$OUTPUT" | grep -o '"number"[[:space:]]*:[[:space:]]*"[^"]*"' | head -1 | sed 's/.*"\([^"]*\)".*/\1/')

        if [ -z "$VERSION" ]; then
          echo "ERROR: Could not determine deployed provider version"
          echo "Broker response: $OUTPUT"
          exit 1
        fi

        echo "Deployed provider version: $VERSION"
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Run Provider Contract Verification
      env:
        PACT_BROKER_URL: ${{ vars.PACT_BROKER_URL_DEV }}
        PACT_BROKER_USERNAME: ${{ vars.PACT_BROKER_USERNAME }}
        PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
        PROVIDER_VERSION: ${{ steps.deployed.outputs.version || steps.get_version.outputs.version }}
        CONSUMER_BRANCH: ${{ github.event.client_payload.consumer_branch }}
        DEPLOYED_VERSION: ${{ steps.deployed.outputs.version }}
        CGO_LDFLAGS: "-L/usr/local/lib"
        LD_LIBRARY_PATH: "/usr/local/lib"
      run: |
        # A deployed version publishes on its own `deployed` branch, not main: the broker moves the head of
        # whatever branch a version is added to
        # (https://github.com/pact-foundation/pact_broker/blob/master/lib/pact_broker/versions/branch_version_repository.rb),
        # so main's head would become this older commit and consumers' can-i-merge would check against it
        # until the next merge. It can't be empty either: the pacts-for-verification request with pending
        # on and no tags rejects a blank branch
        # (https://github.com/pact-foundation/pact_broker/blob/master/lib/pact_broker/api/contracts/pacts_for_verification_json_query_schema.rb).
        if [ -n "$DEPLOYED_VERSION" ]; then export GIT_BRANCH=deployed; fi
        make test-contracts-provider-ci

    - name: Report verification status
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "Provider verification passed - contracts are compatible"
        else
          echo "Provider verification failed - breaking changes detected"
          echo "Review the test output above for details"
        fi

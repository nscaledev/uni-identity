apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-server
  labels:
    {{- include "unikorn.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-server
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-server
      annotations:
        # Cerbos reads config.yaml only at startup, so config changes must
        # roll the pods.  The policies ConfigMap is deliberately NOT
        # annotated: it is live-watched (watchForChanges), and restarting
        # pods on policy writes would be wrong.
        checksum/cerbos-config: {{ include (print $.Template.BasePath "/identity/cerbos-config.yaml") . | sha256sum }}
    spec:
      containers:
      - name: {{ .Release.Name }}-server
        image: {{ include "unikorn.image" . }}
        args:
        {{- include "unikorn.core.flags" . | nindent 8 }}
        {{- include "unikorn.cors.flags" . | nindent 8 }}
        {{- include "unikorn.otlp.flags" . | nindent 8 }}
        - --host=https://{{ include "unikorn.identity.host" . }}
        - --jose-tls-secret={{ .Release.Name }}-jose-tls
        - --refresh-token-duration={{ printf "%dh" (mul .Values.issuer.maxTokenDurationDays 24) }}
        {{- with .Values.identity.auth0Exchange }}
        {{- if .issuer }}
        - --auth0-exchange-issuer={{ .issuer }}
        {{- end }}
        {{- if .audience }}
        - --auth0-exchange-audience={{ .audience }}
        {{- end }}
        {{- end }}
        {{- $adminRoles := list }}
        {{- range $index, $name := .Values.platformAdministrators.roles }}
          {{- $adminRoles = append $adminRoles (include "resource.id" $name) }}
        {{- end }}
        - --platform-administrator-role-ids={{ join "," $adminRoles }}
        - --platform-administrator-subjects={{ join "," .Values.platformAdministrators.subjects }}
        {{- $systemAccounts := list }}
        {{- range $k, $v := .Values.systemAccounts }}
          {{- $systemAccounts = append $systemAccounts (printf "%s=%s" $k (include "resource.id" $v)) }}
        {{- end }}
        - --system-account-roles-ids={{ join "," $systemAccounts }}
        {{- range $i, $arg := .Values.server.extraFlags }}
        - {{ $arg }}
        {{- end }}
        ports:
        - name: http
          containerPort: 6080
        resources:
          {{- .Values.server.resources | toYaml | nindent 10 }}
        securityContext:
          readOnlyRootFilesystem: true
      # Cerbos PDP sidecar: authorization decisions migrate from the in-process
      # evaluator to policies evaluated by this central PDP.  Always on; shadow
      # and cutover gating happens in the Go layer, not here.  This is a
      # third-party image so the first-party image helpers don't apply; the
      # default tag must stay consistent with CERBOS_VERSION in the Makefile.
      - name: cerbos
        image: {{ .Values.cerbos.image | default "ghcr.io/cerbos/cerbos:0.53.0" }}
        args:
        - server
        - --config=/config/config.yaml
        ports:
        - name: cerbos-http
          containerPort: 3592
        - name: cerbos-grpc
          containerPort: 3593
        # Cerbos binds loopback only (see cerbos-config.yaml), so the kubelet
        # cannot reach it over HTTP: probe by exec'ing the in-image healthcheck
        # binary, which reads the mounted config and checks the gRPC listener.
        # The integration test in pkg/authz/cerbos execs this exact command
        # against the test container to keep it honest.
        readinessProbe:
          exec:
            command:
            - /cerbos
            - healthcheck
            - --config=/config/config.yaml
        livenessProbe:
          exec:
            command:
            - /cerbos
            - healthcheck
            - --config=/config/config.yaml
        volumeMounts:
        - name: cerbos-config
          mountPath: /config
          readOnly: true
        - name: cerbos-policies
          mountPath: /policies
          readOnly: true
        # The image declares VOLUME /tmp and /.cache; with a read-only root
        # filesystem they need writable emptyDirs.
        - name: cerbos-tmp
          mountPath: /tmp
        - name: cerbos-cache
          mountPath: /.cache
        resources:
          {{- .Values.cerbos.resources | toYaml | nindent 10 }}
        securityContext:
          readOnlyRootFilesystem: true
          # The upstream image defaults to root, which the pod's runAsNonRoot
          # forbids; run as nobody (verified working with a read-only root
          # filesystem and an empty policy directory).
          runAsUser: 65534
      volumes:
      - name: cerbos-config
        configMap:
          name: {{ .Release.Name }}-cerbos-config
      - name: cerbos-policies
        configMap:
          name: {{ .Release.Name }}-cerbos-policies
      - name: cerbos-tmp
        emptyDir: {}
      - name: cerbos-cache
        emptyDir: {}
      serviceAccountName: {{ .Release.Name }}-server
      securityContext:
        runAsNonRoot: true

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-server
  labels:
    {{- include "unikorn.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-server
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-server
    spec:
      containers:
      - name: {{ .Release.Name }}-server
        image: {{ include "unikorn.image" . }}
        args:
        {{- include "unikorn.core.flags" . | nindent 8 }}
        {{- include "unikorn.cors.flags" . | nindent 8 }}
        {{- include "unikorn.otlp.flags" . | nindent 8 }}
        - --host=https://{{ include "unikorn.identity.host" . }}
        - --jose-tls-secret={{ .Release.Name }}-jose-tls
        - --refresh-token-duration={{ printf "%dh" (mul .Values.issuer.maxTokenDurationDays 24) }}
        {{- with .Values.identity.auth0Exchange }}
        {{- if .issuer }}
        - --auth0-exchange-issuer={{ .issuer }}
        {{- end }}
        {{- if .audience }}
        - --auth0-exchange-audience={{ .audience }}
        {{- end }}
        {{- end }}
        {{- $adminRoles := list }}
        {{- range $index, $name := .Values.platformAdministrators.roles }}
          {{- $adminRoles = append $adminRoles (include "resource.id" $name) }}
        {{- end }}
        - --platform-administrator-role-ids={{ join "," $adminRoles }}
        - --platform-administrator-subjects={{ join "," .Values.platformAdministrators.subjects }}
        {{- $systemAccounts := list }}
        {{- range $k, $v := .Values.systemAccounts }}
          {{- $systemAccounts = append $systemAccounts (printf "%s=%s" $k (include "resource.id" $v)) }}
        {{- end }}
        - --system-account-roles-ids={{ join "," $systemAccounts }}
        {{- if .Values.spiffe.enabled }}
        - --spiffe-tls-listen-address=:{{ .Values.spiffe.listenPort }}
        {{- end }}
        {{- range $i, $arg := .Values.server.extraFlags }}
        - {{ $arg }}
        {{- end }}
        ports:
        - name: http
          containerPort: 6080
        {{- if .Values.spiffe.enabled }}
        - name: mtls
          containerPort: {{ .Values.spiffe.listenPort }}
        {{- end }}
        {{- if .Values.spiffe.enabled }}
        {{- $socketPath := required "spiffe.workloadAPISocketPath is required when spiffe.enabled is true: empty renders SPIFFE_ENDPOINT_SOCKET as unix://, which go-spiffe rejects, and a mountPath of '.', which the kubelet refuses -- both of which fail at container creation rather than here" .Values.spiffe.workloadAPISocketPath }}
        env:
        - name: SPIFFE_ENDPOINT_SOCKET
          value: unix://{{ $socketPath }}
        volumeMounts:
        - name: spiffe-workload-api
          mountPath: {{ dir $socketPath }}
          readOnly: true
        {{- end }}
        resources:
          {{- .Values.server.resources | toYaml | nindent 10 }}
        securityContext:
          readOnlyRootFilesystem: true
      {{- if .Values.spiffe.enabled }}
      volumes:
      - name: spiffe-workload-api
        csi:
          driver: csi.spiffe.io
          readOnly: true
      {{- end }}
      serviceAccountName: {{ .Release.Name }}-server
      securityContext:
        runAsNonRoot: true

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-server
  labels:
    {{- include "unikorn.labels" . | nindent 4 }}
rules:
- apiGroups:
  - identity.unikorn-cloud.org
  resources:
  - groups
  - oauth2clients
  - oauth2providers
  - organizations
  - projects
  - quotas
  - quotametadata
  - roles
  - serviceaccounts
  - users
  - organizationusers
  verbs:
  - list
  - watch
  - update
  - patch
  - create
  - delete
# These are special, hopefully temporarily...
- apiGroups:
  - identity.unikorn-cloud.org
  resources:
  - allocations
  verbs:
  - get
  - list
  - watch
  - update
  - patch
  - create
  - delete
# The account delete reads the record through the uncached client, which is a
# real API server call and needs the get verb.  The cached client does not,
# because it serves reads from an informer backed by list and watch.
- apiGroups:
  - identity.unikorn-cloud.org
  resources:
  - users
  verbs:
  - get
- apiGroups:
  - identity.unikorn-cloud.org
  resources:
  - signingkeys
  verbs:
  - list
  - watch
  - create
  - update
- apiGroups:
  - ""
  resources:
  - secrets
  - configmaps
  - namespaces
  verbs:
  - list
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - get
  - update

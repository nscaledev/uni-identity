apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-server
  labels:
    {{- include "unikorn.labels" . | nindent 4 }}
rules:
# These feed the server's read cache: organizations for namespace routing and
# the organization list, the rest for the organization list includes. Keep this
# list in step with readCacheOptions in cmd/unikorn-identity.
- apiGroups:
  - identity.unikorn-cloud.org
  resources:
  - organizations
  - projects
  - quotas
  - allocations
  verbs:
  - get
  - list
  - watch
  - update
  - patch
  - create
  - delete
# Everything else is read directly from the API server, so needs no watch.
- apiGroups:
  - identity.unikorn-cloud.org
  resources:
  - groups
  - oauth2clients
  - oauth2providers
  - quotametadata
  - roles
  - serviceaccounts
  - users
  - organizationusers
  verbs:
  - get
  - list
  - update
  - patch
  - create
  - delete
- apiGroups:
  - identity.unikorn-cloud.org
  resources:
  - signingkeys
  verbs:
  - get
  - create
  - update
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - list
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - update

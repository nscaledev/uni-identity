apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-server
  labels:
    {{- include "unikorn.labels" . | nindent 4 }}
rules:
- apiGroups:
  - identity.unikorn-cloud.org
  resources:
  - groups
  - oauth2clients
  - oauth2providers
  - organizations
  - projects
  - quotas
  - quotametadata
  - roles
  - serviceaccounts
  - users
  - organizationusers
  verbs:
  - list
  - watch
  - update
  - patch
  - create
  - delete
# These are special, hopefully temporarily...
- apiGroups:
  - identity.unikorn-cloud.org
  resources:
  - allocations
  verbs:
  - get
  - list
  - watch
  - update
  - patch
  - create
  - delete
- apiGroups:
  - identity.unikorn-cloud.org
  resources:
  - signingkeys
  verbs:
  - list
  - watch
  - create
  - update
- apiGroups:
  - ""
  resources:
  - secrets
  - configmaps
  - namespaces
  verbs:
  - list
  - watch
# The policy-store hasher (coarse-decision cache invalidation, A15) does a
# direct Get on the controller-owned policies ConfigMap.  Grant only get on
# configmaps here, as a dedicated rule, rather than broadening the shared
# secrets+configmaps+namespaces rule above (secrets/namespaces stay list+watch).
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - get
  - update

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-server
  labels:
    {{- include "unikorn.labels" . | nindent 4 }}
rules:
- apiGroups:
  - identity.unikorn-cloud.org
  resources:
  - groups
  - oauth2clients
  - oauth2providers
  - organizations
  - projects
  - quotas
  - quotametadata
  - roles
  - serviceaccounts
  - users
  - organizationusers
  verbs:
  - get
  - list
  - watch
  - update
  - patch
  - create
  - delete
# These are special, hopefully temporarily...
- apiGroups:
  - identity.unikorn-cloud.org
  resources:
  - allocations
  verbs:
  - get
  - list
  - watch
  - update
  - patch
  - create
  - delete
# A session write that loses a race reads the user again through the uncached
# client, because the cache can still hold the version that lost.
- apiGroups:
  - identity.unikorn-cloud.org
  resources:
  - users
  verbs:
  - get
- apiGroups:
  - identity.unikorn-cloud.org
  resources:
  - signingkeys
  verbs:
  - get
  - list
  - watch
  - create
  - update
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - configmaps
  - namespaces
  verbs:
  - list
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - get
  - update

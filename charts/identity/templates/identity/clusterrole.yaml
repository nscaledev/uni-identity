apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-server
  labels:
    {{- include "unikorn.labels" . | nindent 4 }}
rules:
# These feed the server's read cache, which serves the per-request token check,
# ACL build and passport exchange, and the organization list. The cache lists
# and watches each kind. Without list the cache never syncs, and startup gives
# up after its sync timeout. Without watch it still syncs from list, then
# relists every 30-60 s and serves stale data between relists. Keep this list in step
# with readCacheOptions in cmd/unikorn-identity.
- apiGroups:
  - identity.unikorn-cloud.org
  resources:
  - organizations
  - projects
  - quotas
  - allocations
  - users
  - serviceaccounts
  - organizationusers
  - oauth2providers
  - roles
  - groups
  verbs:
  - get
  - list
  - watch
  - update
  - patch
  - create
  - delete
- apiGroups:
  - identity.unikorn-cloud.org
  resources:
  - signingkeys
  verbs:
  - get
  - list
  - watch
  - create
  - update
# Everything else is read directly from the API server, so needs no watch.
- apiGroups:
  - identity.unikorn-cloud.org
  resources:
  - oauth2clients
  - quotametadata
  verbs:
  - get
  - list
  - update
  - patch
  - create
  - delete
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - list
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - update

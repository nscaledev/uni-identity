apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-server
  labels:
    {{- include "unikorn.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ .Release.Name }}-server
  ports:
  - name: http
    port: 80
    targetPort: http
  {{- if .Values.spiffe.enabled }}
  - name: spiffe
    port: 6082
    targetPort: spiffe
  {{- end }}

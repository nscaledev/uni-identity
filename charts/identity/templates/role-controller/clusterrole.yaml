apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-role-controller
  labels:
    {{- include "unikorn.labels" . | nindent 4 }}
rules:
# Read every role.  Status writes are granted in the release namespace only,
# see role.yaml.
- apiGroups:
  - identity.unikorn-cloud.org
  resources:
  - roles
  verbs:
  - list
  - get
  - watch

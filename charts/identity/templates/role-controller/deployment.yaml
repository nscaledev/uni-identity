apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-role-controller
  labels:
    {{- include "unikorn.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-role-controller
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-role-controller
    spec:
      containers:
      - name: {{ .Release.Name }}-role-controller
        image: {{ include "unikorn.roleControllerImage" . }}
        args:
        {{- include "unikorn.core.flags" . | nindent 8 }}
        {{- include "unikorn.otlp.flags" . | nindent 8 }}
        {{- include "unikorn.identity.otelEnv" . | nindent 8 }}
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
          {{- .Values.roleController.resources | toYaml | nindent 10 }}
        securityContext:
          readOnlyRootFilesystem: true
      serviceAccountName: {{ .Release.Name }}-role-controller
      securityContext:
        runAsNonRoot: true

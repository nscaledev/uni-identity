{{- /*
Role aggregation guard.  An aggregate-to-* label on a Role widens every org
admin at the next reconcile, with nobody approving it, so the label is a quiet
escalation path (CNPRE-521, CNPRE-712).  This policy applies to every Role in
the release namespace, whichever chart ships it.

A Role may carry an aggregate-to-* label only if:
- its ID is on aggregation.allowedSources (names, turned into IDs here, so the
  check can't be passed by copying a name label),
- it is not protected,
- it has no global scopes,
- it has no identity:* scopes and no credential (.../accesskeys) scopes
  (identity scopes are trust and tenancy surfaces: providers, organizations,
  users, allocations),
- it has no platform-only scopes (granted globally and held by no tenant
  role; a labelled role in values does not count as a tenant role for this
  chart's own global scopes, see unikorn.identity.platformOnlyScopes),
- it is not itself aggregating, unless it is a chain role (reader, user,
  auditor).

The built-in roles are pinned to their fixed shape (unikorn.identity.chainShape),
labelled or not:
- a labelled built-in role carries exactly its aggregate-to-* labels, each
  "true" (reader: auditor and user; user and auditor: administrator;
  administrator: none),
- an aggregating built-in role refs only its base role and selects only its
  own aggregate-to-<name>: "true" label (otherwise its roleRefs or selector
  could pull in any role),
- an aggregating built-in role has its fixed flattenToOrganization
  (administrator and auditor true, user and reader false).

An aggregating Role (one with spec.aggregationRule) must not set spec.scopes:
all of its scopes come from its sources.
*/}}
{{- $allowed := list }}
{{- range ((default (dict) .Values.aggregation).allowedSources | default (list)) }}
{{- $allowed = append $allowed (printf "'%s'" (include "resource.id" .)) }}
{{- end }}
{{- $chain := list }}
{{- range (include "unikorn.identity.chainRoles" . | fromJsonArray) }}
{{- $chain = append $chain (printf "'%s'" (include "resource.id" .)) }}
{{- end }}
{{- $builtin := list }}
{{- range (include "unikorn.identity.builtinRoles" . | fromJsonArray) }}
{{- $builtin = append $builtin (printf "'%s': {'ref': '%s', 'label': 'identity.unikorn-cloud.org/aggregate-to-%s'}" (include "resource.id" .) (include "resource.id" (printf "%s-base" .)) .) }}
{{- end }}
{{- $targets := list }}
{{- $flatten := list }}
{{- range $role, $want := (include "unikorn.identity.chainShape" . | fromJson) }}
{{- $labels := list }}
{{- range $want.to }}
{{- $labels = append $labels (printf "'identity.unikorn-cloud.org/aggregate-to-%s'" .) }}
{{- end }}
{{- $targets = append $targets (printf "'%s': [%s]" (include "resource.id" $role) (join ", " $labels)) }}
{{- $flatten = append $flatten (printf "'%s': %t" (include "resource.id" $role) $want.flatten) }}
{{- end }}
{{- $platformOnly := list }}
{{- range (include "unikorn.identity.platformOnlyScopes" . | fromJsonArray) }}
{{- $platformOnly = append $platformOnly (printf "'%s'" .) }}
{{- end }}
{{- $name := printf "%s-role-aggregation.identity.unikorn-cloud.org" .Release.Name }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "unikorn.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - identity.unikorn-cloud.org
      apiVersions:
      - '*'
      resources:
      - roles
      operations:
      - CREATE
      - UPDATE
  variables:
  - name: labelled
    expression: "object.metadata.?labels.orValue({}).exists(k, k.startsWith('identity.unikorn-cloud.org/aggregate-to-'))"
  - name: global
    expression: "object.?spec.?scopes.?global.orValue([])"
  - name: scoped
    expression: "object.?spec.?scopes.?organization.orValue([]).map(s, s.name) + object.?spec.?scopes.?project.orValue([]).map(s, s.name)"
  - name: aggregating
    expression: "object.?spec.?aggregationRule.hasValue()"
  - name: chain
    expression: "[{{ join ", " $chain }}]"
  - name: builtin
    expression: "{ {{- join ", " $builtin -}} }"
  - name: chainTargets
    expression: "{ {{- join ", " $targets -}} }"
  - name: chainFlatten
    expression: "{ {{- join ", " $flatten -}} }"
  validations:
  - expression: "!variables.labelled || object.metadata.name in [{{ join ", " $allowed }}]"
    messageExpression: "'role ' + object.metadata.name + ' carries an aggregate-to-* label but is not on the identity chart aggregation.allowedSources list'"
    reason: Forbidden
  - expression: "!variables.labelled || !object.?spec.?protected.orValue(false)"
    message: A protected role cannot carry an aggregate-to-* label
    reason: Forbidden
  - expression: "!variables.labelled || size(variables.global) == 0"
    message: A role with global scopes cannot carry an aggregate-to-* label
    reason: Forbidden
  - expression: "!variables.labelled || !variables.scoped.exists(s, s.startsWith('identity:') || s.endsWith('/accesskeys'))"
    message: A role with identity:* or credential (.../accesskeys) scopes cannot carry an aggregate-to-* label
    reason: Forbidden
  - expression: "!variables.labelled || !variables.scoped.exists(s, s in [{{ join ", " $platformOnly }}])"
    message: A role with platform-only scopes (granted only globally by the identity chart) cannot carry an aggregate-to-* label
    reason: Forbidden
  - expression: "!variables.labelled || !variables.aggregating || object.metadata.name in variables.chain"
    message: A role with an aggregate-to-* label cannot also aggregate, except the built-in chain roles (reader, user, auditor)
    reason: Forbidden
  - expression: >-
      !variables.aggregating || !(object.metadata.name in variables.builtin) ||
      (object.spec.aggregationRule.?roleRefs.orValue([]) == [variables.builtin[object.metadata.name].ref] &&
      size(object.spec.aggregationRule.?roleSelectors.orValue([])) == 1 &&
      object.spec.aggregationRule.roleSelectors[0].?matchLabels.orValue({}) == {variables.builtin[object.metadata.name].label: 'true'} &&
      size(object.spec.aggregationRule.roleSelectors[0].?matchExpressions.orValue([])) == 0)
    message: An aggregating built-in role must ref only its base role and select only its own aggregate-to-* label
    reason: Forbidden
  - expression: >-
      !variables.labelled || !(object.metadata.name in variables.chainTargets) ||
      (object.metadata.labels.filter(k, k.startsWith('identity.unikorn-cloud.org/aggregate-to-')).all(k, k in variables.chainTargets[object.metadata.name]) &&
      variables.chainTargets[object.metadata.name].all(k, k in object.metadata.labels && object.metadata.labels[k] == 'true'))
    message: A built-in role must carry exactly its own aggregate-to-* labels, each "true" (reader to auditor and user, user and auditor to administrator, administrator none)
    reason: Forbidden
  - expression: >-
      !variables.aggregating || !(object.metadata.name in variables.chainFlatten) ||
      object.spec.aggregationRule.?flattenToOrganization.orValue(false) == variables.chainFlatten[object.metadata.name]
    message: A built-in role must keep its flattenToOrganization (administrator and auditor true, user and reader false)
    reason: Forbidden
  - expression: "!variables.aggregating || (size(variables.global) == 0 && size(variables.scoped) == 0)"
    message: An aggregating role (spec.aggregationRule) must not set spec.scopes; move them to a base role in roleRefs
    reason: Invalid
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "unikorn.labels" . | nindent 4 }}
spec:
  policyName: {{ $name }}
  validationActions:
  - Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}

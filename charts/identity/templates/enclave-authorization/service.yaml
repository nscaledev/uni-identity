{{- if .Values.enclaveAuthorization.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-enclave-authorization
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "unikorn.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ .Release.Name }}-enclave-authorization
  ports:
  - name: http
    port: 80
    targetPort: http
{{- end }}

{{- if .Values.enclaveAuthorization.enabled }}
# The enclave authorization profile: the same image as the full identity
# server, run with --api-profile set to "authorization" so only the
# read-only authorization surface is mounted (see pkg/server/server.go,
# mountAPI).
# It resolves bindings through pkg/rbac from the SAME configuration as
# charts/identity/templates/identity/deployment.yaml, sourced from the same
# values keys, so it can never disagree with the centre about a binding for
# identical replicated state. It issues no tokens and holds no signing key,
# but --host is still required: pkg/oauth2's getInternalIssuer/getAudience
# need it to validate incoming tokens, and it is otherwise empty.
#
# The enclave is its own Helm release, installed into the projection
# namespace (see enclaveAuthorization in values.yaml), so every resource
# here uses .Release.Namespace directly rather than a configurable override.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-enclave-authorization
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "unikorn.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.enclaveAuthorization.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-enclave-authorization
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-enclave-authorization
      annotations:
        # Cerbos reads config.yaml only at startup, so config changes must
        # roll the pods.  The policy store ConfigMap (owned and published at
        # runtime by the policy controller, not templated by this chart) is
        # deliberately NOT annotated: it is live-watched (watchForChanges),
        # and restarting pods on policy writes would be wrong.
        checksum/cerbos-config: {{ include (print $.Template.BasePath "/identity/cerbos-config.yaml") . | sha256sum }}
    spec:
      containers:
      - name: {{ .Release.Name }}-enclave-authorization
        image: {{ include "unikorn.image" . }}
        args:
        - --namespace={{ .Release.Namespace }}
        {{- include "unikorn.cors.flags" . | nindent 8 }}
        {{- include "unikorn.otlp.flags" . | nindent 8 }}
        # --host is the token ISSUER identity, not the address this pod serves
        # on: pkg/oauth2 validates every incoming passport's issuer and audience
        # against it (getInternalIssuer/getAudience -> VerifyInfo), and the
        # token exchange that mints those passports stays central (see
        # pkg/middleware/openapi/remote.WithAuthorizationHost). This profile
        # validates as a resource server, so the expected issuer is the CENTRE,
        # exactly as identity/deployment.yaml renders it; enclaveAuthorization.host
        # is only the DNS name of this profile's own front door. Rendering the
        # enclave host here rejects every passport, because the issuer and
        # audience claims name the centre.
        #
        # This value is necessary but not sufficient: the profile still decrypts
        # the passport locally against a SigningKey it does not hold. See the
        # enclaveAuthorization block in values.yaml.
        - --host=https://{{ include "unikorn.identity.host" . }}
        - --api-profile=authorization
        # Serves /readyz off this directory, which the readinessProbe below
        # reads; the same path the policy volume is mounted at.
        - --readiness-policy-directory=/policies
        {{- with .Values.identity.authorizationEngine }}
        - --authorization-engine={{ . }}
        {{- end }}
        {{- with .Values.identity.cerbosAuthoritativeKinds }}
        # Strangle-by-kind cutover: these endpoint kinds are served
        # authoritatively by Cerbos regardless of --authorization-engine (no
        # legacy fallback, fail-closed).  Rendered only when non-empty, so the
        # default deploy sets no cutover — flip is deferred; set kinds per-kind
        # post-soak.
        - --cerbos-authoritative-kinds={{ join "," . }}
        {{- end }}
        # The controller-owned policy store ConfigMap, read to key the
        # coarse-decision cache on the policy-store hash so a republish busts
        # it.  Same expression the cerbos sidecar's policy volume and the
        # policy controller reference, so publisher, consumer and cache cannot
        # drift.
        - --cerbos-policies-configmap={{ .Release.Name }}-cerbos-policies
        {{- $adminRoles := list }}
        {{- range $index, $name := .Values.platformAdministrators.roles }}
          {{- $adminRoles = append $adminRoles (include "resource.id" $name) }}
        {{- end }}
        - --platform-administrator-role-ids={{ join "," $adminRoles }}
        {{- range $i, $s := .Values.platformAdministrators.subjects }}
          {{- /*
          The server matches subjects case-sensitively; only the "::"-separated
          subject part is checked, mirroring how the flag parser splits issuer
          from subject.
          */}}
          {{- $subj := $s }}
          {{- $cut := splitn "::" 2 $s }}
          {{- if $cut._1 }}
            {{- $subj = $cut._1 }}
          {{- end }}
          {{- if and (ne $subj "*") (regexMatch "[A-Z]" $subj) }}
            {{- fail (printf "platformAdministrators.subjects[%d]: subject must be its canonical lower-case form" $i) }}
          {{- end }}
        {{- end }}
        - --platform-administrator-subjects={{ join "," .Values.platformAdministrators.subjects }}
        {{- $systemAccounts := list }}
        {{- range $k, $v := .Values.systemAccounts }}
          {{- $systemAccounts = append $systemAccounts (printf "%s=%s" $k (include "resource.id" $v)) }}
        {{- end }}
        - --system-account-roles-ids={{ join "," $systemAccounts }}
        {{- include "unikorn.globalRoleBindingArgs" . }}
        {{- include "unikorn.globalGroupRoleBindingArgs" . }}
        ports:
        - name: http
          containerPort: 6080
        # In-cluster credentials for the Kubernetes client
        # (rest.InClusterConfig).  automountServiceAccountToken is disabled
        # pod-wide (see below) to keep this SA's token out of the third-party
        # cerbos sidecar, so the first-party server mounts it explicitly at the
        # standard path the client library reads.
        volumeMounts:
        - name: kube-api-access
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
        # The same projection the Cerbos sidecar mounts, so the first-party
        # server can read the publication marker the controller writes (see
        # the readinessProbe below).
        - name: cerbos-policies
          mountPath: /policies
          readOnly: true
        resources:
          {{- .Values.server.resources | toYaml | nindent 10 }}
        # /readyz gates on the policy controller's publication marker, not on
        # the presence of policy files. Cerbos is healthy with an empty policy
        # directory and would deny every request while Kubernetes sent it
        # traffic, so a pod must not join the Service before the controller has
        # published once.
        #
        # A readiness probe, deliberately, and only because the marker exists.
        # A withdrawal publishes no policy document, so a file-counting gate
        # would hold every REPLACEMENT pod out of service for as long as the
        # withdrawal lasted: one malformed Role would then cost capacity on the
        # next eviction, drain or rollout. The marker distinguishes "withdrawn
        # on purpose", which is ready and serves deny-all, from "never
        # published", which is not. And a missing publication should hold a pod
        # out of the Service rather than restart its container, which a
        # startupProbe would do every five minutes without making the ConfigMap
        # arrive any sooner.
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 3
        securityContext:
          readOnlyRootFilesystem: true
      # Cerbos PDP sidecar: same setup as identity/deployment.yaml. This
      # profile always runs one, since the authorization surface has no
      # legacy fallback for an enclave.
      - name: cerbos
        image: {{ .Values.cerbos.image | default "ghcr.io/cerbos/cerbos:0.53.0" }}
        args:
        - server
        - --config=/config/config.yaml
        ports:
        - name: cerbos-http
          containerPort: 3592
        - name: cerbos-grpc
          containerPort: 3593
        # Cerbos binds loopback only (see cerbos-config.yaml), so the kubelet
        # cannot reach it over HTTP: probe by exec'ing the in-image healthcheck
        # binary, which reads the mounted config and checks the gRPC listener.
        readinessProbe:
          exec:
            command:
            - /cerbos
            - healthcheck
            - --config=/config/config.yaml
        livenessProbe:
          exec:
            command:
            - /cerbos
            - healthcheck
            - --config=/config/config.yaml
        volumeMounts:
        - name: cerbos-config
          mountPath: /config
          readOnly: true
        - name: cerbos-policies
          mountPath: /policies
          readOnly: true
        # The image declares VOLUME /tmp and /.cache; with a read-only root
        # filesystem they need writable emptyDirs.
        - name: cerbos-tmp
          mountPath: /tmp
        - name: cerbos-cache
          mountPath: /.cache
        resources:
          {{- .Values.cerbos.resources | toYaml | nindent 10 }}
        securityContext:
          readOnlyRootFilesystem: true
          # The upstream image defaults to root, which the pod's runAsNonRoot
          # forbids; run as nobody (verified working with a read-only root
          # filesystem and an empty policy directory).
          runAsUser: 65534
      volumes:
      # Reproduces the default ServiceAccount token projection that
      # automountServiceAccountToken: false suppresses, so it can be mounted
      # into the server container alone and never the cerbos sidecar.  The
      # three sources are exactly what rest.InClusterConfig() reads: the bound
      # token, the API server CA, and the pod namespace.
      - name: kube-api-access
        projected:
          defaultMode: 420
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3607
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
          - downwardAPI:
              items:
              - path: namespace
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
      # The same ConfigMaps the centre's Cerbos sidecar mounts
      # (identity/deployment.yaml, identity/cerbos-config.yaml): config is
      # identical, and the policy store is the same replicated projection.
      - name: cerbos-config
        configMap:
          name: {{ .Release.Name }}-cerbos-config
      - name: cerbos-policies
        configMap:
          name: {{ .Release.Name }}-cerbos-policies
          # The policy controller owns, creates and publishes this ConfigMap
          # at runtime; the chart does not template it.  It is deliberately
          # NOT optional: an optional volume lets a pod start with no
          # projection at all, and an enclave with no policy store denies
          # every request. Requiring it makes the kubelet hold the pod in
          # ContainerCreating until the controller has published once, which
          # is a legible wait instead of a serving pod that denies
          # everything. The readinessProbe above covers the remaining case, a
          # ConfigMap that exists but carries no publication marker.
      - name: cerbos-tmp
        emptyDir: {}
      - name: cerbos-cache
        emptyDir: {}
      serviceAccountName: {{ .Release.Name }}-enclave-authorization
      # Kubernetes otherwise auto-projects this SA's token into every container
      # in the pod, including the third-party cerbos sidecar.  Disable that and
      # hand the token to the first-party server container only, via the
      # kube-api-access projected volume mounted above.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
{{- end }}

{{- if .Values.enclaveAuthorization.enabled }}
{{- $ns := .Values.enclaveAuthorization.namespace | default .Release.Namespace }}
# The enclave authorization profile: the same image as the full identity
# server, run with --api-profile set to "authorization" so only the
# read-only authorization surface is mounted (see pkg/server/server.go,
# mountAPI).
# It resolves bindings through pkg/rbac from the SAME configuration as
# charts/identity/templates/identity/deployment.yaml, sourced from the same
# values keys, so it can never disagree with the centre about a binding for
# identical replicated state. It carries no OAuth2, JOSE or issuer flags: it
# issues no tokens and holds no signing key.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-enclave-authorization
  namespace: {{ $ns }}
  labels:
    {{- include "unikorn.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.enclaveAuthorization.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-enclave-authorization
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-enclave-authorization
      annotations:
        # Cerbos reads config.yaml only at startup, so config changes must
        # roll the pods.  The policy store ConfigMap (owned and published at
        # runtime by the policy controller, not templated by this chart) is
        # deliberately NOT annotated: it is live-watched (watchForChanges),
        # and restarting pods on policy writes would be wrong.
        checksum/cerbos-config: {{ include (print $.Template.BasePath "/identity/cerbos-config.yaml") . | sha256sum }}
    spec:
      containers:
      - name: {{ .Release.Name }}-enclave-authorization
        image: {{ include "unikorn.image" . }}
        args:
        - --namespace={{ $ns }}
        {{- include "unikorn.cors.flags" . | nindent 8 }}
        {{- include "unikorn.otlp.flags" . | nindent 8 }}
        - --api-profile=authorization
        {{- with .Values.identity.authorizationEngine }}
        - --authorization-engine={{ . }}
        {{- end }}
        {{- with .Values.identity.cerbosAuthoritativeKinds }}
        # Strangle-by-kind cutover: these endpoint kinds are served
        # authoritatively by Cerbos regardless of --authorization-engine (no
        # legacy fallback, fail-closed).  Rendered only when non-empty, so the
        # default deploy sets no cutover — flip is deferred; set kinds per-kind
        # post-soak.
        - --cerbos-authoritative-kinds={{ join "," . }}
        {{- end }}
        # The controller-owned policy store ConfigMap, read to key the
        # coarse-decision cache on the policy-store hash so a republish busts
        # it.  Same expression the cerbos sidecar's policy volume and the
        # policy controller reference, so publisher, consumer and cache cannot
        # drift.
        - --cerbos-policies-configmap={{ .Release.Name }}-cerbos-policies
        {{- $adminRoles := list }}
        {{- range $index, $name := .Values.platformAdministrators.roles }}
          {{- $adminRoles = append $adminRoles (include "resource.id" $name) }}
        {{- end }}
        - --platform-administrator-role-ids={{ join "," $adminRoles }}
        {{- range $i, $s := .Values.platformAdministrators.subjects }}
          {{- /*
          The server matches subjects case-sensitively; only the "::"-separated
          subject part is checked, mirroring how the flag parser splits issuer
          from subject.
          */}}
          {{- $subj := $s }}
          {{- $cut := splitn "::" 2 $s }}
          {{- if $cut._1 }}
            {{- $subj = $cut._1 }}
          {{- end }}
          {{- if and (ne $subj "*") (regexMatch "[A-Z]" $subj) }}
            {{- fail (printf "platformAdministrators.subjects[%d]: subject must be its canonical lower-case form" $i) }}
          {{- end }}
        {{- end }}
        - --platform-administrator-subjects={{ join "," .Values.platformAdministrators.subjects }}
        {{- $systemAccounts := list }}
        {{- range $k, $v := .Values.systemAccounts }}
          {{- $systemAccounts = append $systemAccounts (printf "%s=%s" $k (include "resource.id" $v)) }}
        {{- end }}
        - --system-account-roles-ids={{ join "," $systemAccounts }}
        {{- range $i, $b := .Values.globalRoleBindings }}
          {{- if not (trim (default "" $b.issuer)) }}
            {{- fail (printf "globalRoleBindings[%d]: issuer is required" $i) }}
          {{- end }}
          {{- if regexMatch "\\s" $b.issuer }}
            {{- fail (printf "globalRoleBindings[%d]: issuer must not contain whitespace" $i) }}
          {{- end }}
          {{- /*
          Right-anchored parsing means a "::" in either field silently shifts
          the boundary, undetectably once the flag is built. Reject it here,
          while the intended split is still known.
          */}}
          {{- if contains "::" $b.issuer }}
            {{- fail (printf "globalRoleBindings[%d]: issuer must not contain \"::\"" $i) }}
          {{- end }}
          {{- if and (hasKey $b "subject") (hasKey $b "subjects") }}
            {{- fail (printf "globalRoleBindings[%d]: subject and subjects are mutually exclusive" $i) }}
          {{- end }}
          {{- $subjects := list }}
          {{- if hasKey $b "subject" }}
            {{- $subjects = list $b.subject }}
          {{- else }}
            {{- $subjects = default (list) $b.subjects }}
          {{- end }}
          {{- if not $subjects }}
            {{- fail (printf "globalRoleBindings[%d]: exactly one of subject or non-empty subjects required" $i) }}
          {{- end }}
          {{- /*
          Trim before validating and emitting, so a padded " * " cannot slip
          past the wildcard guards and then match as a wildcard server-side.
          */}}
          {{- $trimmedSubjects := list }}
          {{- range $si, $subject := $subjects }}
            {{- $trimmed := trim (default "" $subject) }}
            {{- if not $trimmed }}
              {{- fail (printf "globalRoleBindings[%d].subjects[%d]: empty or whitespace-only subject" $i $si) }}
            {{- end }}
            {{- if contains "::" $trimmed }}
              {{- fail (printf "globalRoleBindings[%d].subjects[%d]: subject must not contain \"::\"" $i $si) }}
            {{- end }}
            {{- if and (ne $trimmed "*") (regexMatch "[A-Z]" $trimmed) }}
              {{- fail (printf "globalRoleBindings[%d].subjects[%d]: subject must be its canonical lower-case form" $i $si) }}
            {{- end }}
            {{- if and (eq $b.issuer "uni") (eq $trimmed "*") }}
              {{- fail (printf "globalRoleBindings[%d]: wildcard subject not allowed on the UNI sentinel issuer" $i) }}
            {{- end }}
            {{- $trimmedSubjects = append $trimmedSubjects $trimmed }}
          {{- end }}
          {{- if not $b.roles }}
            {{- fail (printf "globalRoleBindings[%d]: roles must be non-empty" $i) }}
          {{- end }}
          {{- $allRoles := merge (dict) (default (dict) $.Values.roles) (default (dict) $.Values.additionalRoles) }}
          {{- $roles := list }}
          {{- range $b.roles }}
            {{- if not (hasKey $allRoles .) }}
              {{- fail (printf "globalRoleBindings[%d]: unknown role %q" $i .) }}
            {{- end }}
            {{- $roles = append $roles (include "resource.id" .) }}
          {{- end }}
          {{- /*
          Render-time guard: a wildcard binding's roles must declare no
          non-read global operation. Complementary to the runtime clamp in
          accumulateGlobalReadPermissions (pkg/rbac/bindings.go); full
          rationale in pkg/rbac/README.md#global-role-bindings.
          */}}
          {{- if has "*" $trimmedSubjects }}
            {{- range $b.roles }}
              {{- $roleName := . }}
              {{- $role := index $allRoles $roleName }}
              {{- $roleScopes := default (dict) $role.scopes }}
              {{- $globalScopes := default (dict) $roleScopes.global }}
              {{- range $scopeName, $ops := $globalScopes }}
                {{- range $ops }}
                  {{- if ne . "read" }}
                    {{- fail (printf "globalRoleBindings[%d]: wildcard binding role %q grants non-read global operation %q on scope %q" $i $roleName . $scopeName) }}
                  {{- end }}
                {{- end }}
              {{- end }}
            {{- end }}
          {{- end }}
          {{- range $subject := $trimmedSubjects }}
        - {{ printf "--global-role-binding=%s::%s::%s" $b.issuer $subject (join "," $roles) | quote }}
          {{- end }}
        {{- end }}
        {{- range $i, $b := .Values.globalGroupRoleBindings }}
          {{- if not (trim (default "" $b.issuer)) }}
            {{- fail (printf "globalGroupRoleBindings[%d]: issuer is required" $i) }}
          {{- end }}
          {{- if regexMatch "\\s" $b.issuer }}
            {{- fail (printf "globalGroupRoleBindings[%d]: issuer must not contain whitespace" $i) }}
          {{- end }}
          {{- if contains "::" $b.issuer }}
            {{- fail (printf "globalGroupRoleBindings[%d]: issuer must not contain \"::\"" $i) }}
          {{- end }}
          {{- if eq $b.issuer "uni" }}
            {{- fail (printf "globalGroupRoleBindings[%d]: the uni sentinel issuer cannot carry groups" $i) }}
          {{- end }}
          {{- $group := trim (default "" $b.group) }}
          {{- if not $group }}
            {{- fail (printf "globalGroupRoleBindings[%d]: group is required" $i) }}
          {{- end }}
          {{- if eq $group "*" }}
            {{- fail (printf "globalGroupRoleBindings[%d]: wildcard group not allowed; use a wildcard subject binding" $i) }}
          {{- end }}
          {{- if contains "::" $group }}
            {{- fail (printf "globalGroupRoleBindings[%d]: group must not contain \"::\"" $i) }}
          {{- end }}
          {{- if regexMatch "[\t\n\r]" $group }}
            {{- fail (printf "globalGroupRoleBindings[%d]: group must not contain control whitespace" $i) }}
          {{- end }}
          {{- if not $b.roles }}
            {{- fail (printf "globalGroupRoleBindings[%d]: roles must be non-empty" $i) }}
          {{- end }}
          {{- $allRoles := merge (dict) (default (dict) $.Values.roles) (default (dict) $.Values.additionalRoles) }}
          {{- $roles := list }}
          {{- range $b.roles }}
            {{- if not (hasKey $allRoles .) }}
              {{- fail (printf "globalGroupRoleBindings[%d]: unknown role %q" $i .) }}
            {{- end }}
            {{- $roles = append $roles (include "resource.id" .) }}
          {{- end }}
          {{- /*
          Render-time guard: a group binding must not carry write on the
          credential and trust scopes. A write there mints credentials or
          edits issuer trust. That converts a settings grant into an
          identity grant. Other write scopes stay allowed, unlike the
          wildcard guard above. No runtime read clamp applies.
          */}}
          {{- $credentialScopes := list "identity:users" "identity:groups" "identity:roles" "identity:serviceaccounts" "identity:oauth2providers" }}
          {{- range $b.roles }}
            {{- $roleName := . }}
            {{- $role := index $allRoles $roleName }}
            {{- $roleScopes := default (dict) $role.scopes }}
            {{- $globalScopes := default (dict) $roleScopes.global }}
            {{- range $scopeName, $ops := $globalScopes }}
              {{- if has $scopeName $credentialScopes }}
                {{- range $ops }}
                  {{- if ne . "read" }}
                    {{- fail (printf "globalGroupRoleBindings[%d]: role %q grants non-read operation %q on credential scope %q" $i $roleName . $scopeName) }}
                  {{- end }}
                {{- end }}
              {{- end }}
            {{- end }}
          {{- end }}
        - {{ printf "--global-group-role-binding=%s::%s::%s" $b.issuer $group (join "," $roles) | quote }}
        {{- end }}
        ports:
        - name: http
          containerPort: 6080
        # In-cluster credentials for the Kubernetes client
        # (rest.InClusterConfig).  automountServiceAccountToken is disabled
        # pod-wide (see below) to keep this SA's token out of the third-party
        # cerbos sidecar, so the first-party server mounts it explicitly at the
        # standard path the client library reads.
        volumeMounts:
        - name: kube-api-access
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
        resources:
          {{- .Values.server.resources | toYaml | nindent 10 }}
        securityContext:
          readOnlyRootFilesystem: true
      # Cerbos PDP sidecar: same setup as identity/deployment.yaml. This
      # profile always runs one, since the authorization surface has no
      # legacy fallback for an enclave.
      - name: cerbos
        image: {{ .Values.cerbos.image | default "ghcr.io/cerbos/cerbos:0.53.0" }}
        args:
        - server
        - --config=/config/config.yaml
        ports:
        - name: cerbos-http
          containerPort: 3592
        - name: cerbos-grpc
          containerPort: 3593
        # Cerbos binds loopback only (see cerbos-config.yaml), so the kubelet
        # cannot reach it over HTTP: probe by exec'ing the in-image healthcheck
        # binary, which reads the mounted config and checks the gRPC listener.
        readinessProbe:
          exec:
            command:
            - /cerbos
            - healthcheck
            - --config=/config/config.yaml
        livenessProbe:
          exec:
            command:
            - /cerbos
            - healthcheck
            - --config=/config/config.yaml
        volumeMounts:
        - name: cerbos-config
          mountPath: /config
          readOnly: true
        - name: cerbos-policies
          mountPath: /policies
          readOnly: true
        # The image declares VOLUME /tmp and /.cache; with a read-only root
        # filesystem they need writable emptyDirs.
        - name: cerbos-tmp
          mountPath: /tmp
        - name: cerbos-cache
          mountPath: /.cache
        resources:
          {{- .Values.cerbos.resources | toYaml | nindent 10 }}
        securityContext:
          readOnlyRootFilesystem: true
          # The upstream image defaults to root, which the pod's runAsNonRoot
          # forbids; run as nobody (verified working with a read-only root
          # filesystem and an empty policy directory).
          runAsUser: 65534
      volumes:
      # Reproduces the default ServiceAccount token projection that
      # automountServiceAccountToken: false suppresses, so it can be mounted
      # into the server container alone and never the cerbos sidecar.  The
      # three sources are exactly what rest.InClusterConfig() reads: the bound
      # token, the API server CA, and the pod namespace.
      - name: kube-api-access
        projected:
          defaultMode: 420
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3607
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
          - downwardAPI:
              items:
              - path: namespace
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
      # The same ConfigMaps the centre's Cerbos sidecar mounts
      # (identity/deployment.yaml, identity/cerbos-config.yaml): config is
      # identical, and the policy store is the same replicated projection.
      - name: cerbos-config
        configMap:
          name: {{ .Release.Name }}-cerbos-config
      - name: cerbos-policies
        configMap:
          name: {{ .Release.Name }}-cerbos-policies
          # The policy controller owns, creates and publishes this ConfigMap
          # at runtime; the chart does not template it.  optional lets the
          # pod start before the first publish — Cerbos serves
          # deny-by-default from the empty directory, and the kubelet
          # back-fills the volume once the ConfigMap appears.
          optional: true
      - name: cerbos-tmp
        emptyDir: {}
      - name: cerbos-cache
        emptyDir: {}
      serviceAccountName: {{ .Release.Name }}-enclave-authorization
      # Kubernetes otherwise auto-projects this SA's token into every container
      # in the pod, including the third-party cerbos sidecar.  Disable that and
      # hand the token to the first-party server container only, via the
      # kube-api-access projected volume mounted above.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
{{- end }}

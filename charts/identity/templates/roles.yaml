{{- $base := default (dict) .Values.roles }}
{{- $additional := default (dict) .Values.additionalRoles }}
{{- range $name, $_ := $additional }}
{{- if hasKey $base $name }}
{{- fail (printf "additionalRoles key %q conflicts with built-in role" $name) }}
{{- end }}
{{- end }}
{{- $roles := merge (dict) $base }}
{{- $roles = merge $roles $additional }}
{{- $aggregation := default (dict) .Values.aggregation }}
{{- $allowedSources := $aggregation.allowedSources | default (list) }}
{{- $builtinAggregate := $aggregation.builtinRoles }}
{{- $builtins := include "unikorn.identity.builtinRoles" . | fromJsonArray }}
{{- $chain := include "unikorn.identity.chainRoles" . | fromJsonArray }}
{{- /*
An old Role CRD prunes spec.aggregationRule, and the built-in roles would hold
nothing.  lookup is empty under helm template and Argo CD, so this only runs
on a real helm install or upgrade.
*/}}
{{- if $builtinAggregate }}
{{- with lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "roles.identity.unikorn-cloud.org" }}
{{- range .spec.versions }}
{{- if and (eq .name "v1alpha1") (not (dig "schema" "openAPIV3Schema" "properties" "spec" "properties" "aggregationRule" "" .)) }}
{{- fail "aggregation.builtinRoles needs the Role CRD with spec.aggregationRule: apply charts/identity/crds first (helm upgrade does not update CRDs)" }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- /*
With aggregation.builtinRoles off, a built-in role is a plain role holding its
base role's scopes.
*/}}
{{- $plain := dict }}
{{- range $name := $builtins }}
{{- $spec := index $roles $name }}
{{- if and $spec (not $builtinAggregate) }}
{{- $_ := set $plain $name (dict "description" $spec.description "scopes" (index $roles (printf "%s-base" $name)).scopes) }}
{{- end }}
{{- end }}
{{- /*
Two passes: roles that don't aggregate first, then aggregating roles, so a
base role exists before the role that refs it.  Helm applies in this order;
Argo CD applies by sync wave, so aggregating roles also carry a later wave.
Without this, administrator (f194...) is applied before administrator-base
(f43f...) and holds nothing until the base arrives.
*/}}
{{- $ordered := list }}
{{- range $name, $spec := $roles }}
{{- if or (not $spec.aggregationRule) (hasKey $plain $name) }}
{{- $ordered = append $ordered $name }}
{{- end }}
{{- end }}
{{- range $name, $spec := $roles }}
{{- if and $spec.aggregationRule (not (hasKey $plain $name)) }}
{{- $ordered = append $ordered $name }}
{{- end }}
{{- end }}
{{- range $name := $ordered }}
{{- $spec := index $roles $name }}
{{- /*
Render-time guards for aggregation.  They mirror the admission policy and the
role controller, so a bad values file fails here, before it reaches a cluster.
The platform-only scope rule has no guard here: a role in values counts as a
tenant role, so its own scopes are never platform-only.
*/}}
{{- range $key, $_ := $spec.labels }}
  {{- if or (hasPrefix "identity.unikorn-cloud.org/aggregate-to-" $key) (eq $key "unikorn-cloud.org/name") }}
    {{- fail (printf "role %q: labels must not set %q, use aggregateTo for aggregation" $name $key) }}
  {{- end }}
{{- end }}
{{- if $spec.aggregationRule }}
  {{- if $spec.scopes }}
    {{- fail (printf "role %q: an aggregating role must not set scopes, move them to a base role in aggregationRule.roleRefs" $name) }}
  {{- end }}
  {{- range $spec.aggregationRule.roleRefs }}
    {{- if not (hasKey $roles .) }}
      {{- fail (printf "role %q: aggregationRule.roleRefs names unknown role %q" $name .) }}
    {{- end }}
    {{- if eq . $name }}
      {{- fail (printf "role %q: aggregationRule.roleRefs names itself" $name) }}
    {{- end }}
  {{- end }}
  {{- if $spec.aggregateTo }}
    {{- if not (has $name $chain) }}
      {{- fail (printf "role %q: a role with aggregateTo cannot also aggregate, except the built-in chain roles" $name) }}
    {{- end }}
    {{- if not (deepEqual $spec.aggregationRule.roleRefs (list (printf "%s-base" $name))) }}
      {{- fail (printf "role %q: a chain role must ref exactly %s-base" $name $name) }}
    {{- end }}
  {{- end }}
{{- end }}
{{- if $spec.aggregateTo }}
  {{- if $spec.protected }}
    {{- fail (printf "role %q: a protected role cannot opt into aggregation" $name) }}
  {{- end }}
  {{- if not (has $name $allowedSources) }}
    {{- fail (printf "role %q: aggregateTo needs the role on aggregation.allowedSources" $name) }}
  {{- end }}
  {{- $scopes := default (dict) $spec.scopes }}
  {{- if $scopes.global }}
    {{- fail (printf "role %q: a role with global scopes cannot opt into aggregation" $name) }}
  {{- end }}
  {{- range $scope, $_ := merge (dict) (default (dict) $scopes.organization) (default (dict) $scopes.project) }}
    {{- if or (hasPrefix "identity:" $scope) (hasSuffix "/accesskeys" $scope) }}
      {{- fail (printf "role %q: a role with identity:* or credential (.../accesskeys) scope %q cannot opt into aggregation" $name $scope) }}
    {{- end }}
  {{- end }}
  {{- range $target := $spec.aggregateTo }}
    {{- $targetSpec := index $roles $target }}
    {{- if not (and $targetSpec $targetSpec.aggregationRule) }}
      {{- fail (printf "role %q: aggregateTo names %q, which is not an aggregating role" $name $target) }}
    {{- end }}
  {{- end }}
{{- end }}
{{- if hasKey $plain $name }}
{{- $spec = index $plain $name }}
{{- end }}
---
apiVersion: identity.unikorn-cloud.org/v1alpha1
kind: Role
metadata:
  name: {{ include "resource.id" $name }}
  labels:
    {{- include "unikorn.labels" $ | nindent 4 }}
    unikorn-cloud.org/name: {{ $name }}
    {{- range $key, $value := $spec.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
    {{- range $spec.aggregateTo | default (list) | uniq }}
    identity.unikorn-cloud.org/aggregate-to-{{ . }}: "true"
    {{- end }}
  {{- if or $spec.description $spec.aggregationRule }}
  annotations:
    {{- with $spec.description }}
    unikorn-cloud.org/description: {{ . }}
    {{- end }}
    {{- if $spec.aggregationRule }}
    argocd.argoproj.io/sync-wave: "1"
    {{- end }}
  {{- end }}
spec:
  {{- if $spec.protected }}
  protected: true
  {{- end }}
  {{- with $rule := $spec.aggregationRule }}
  aggregationRule:
    roleSelectors:
    - matchLabels:
        identity.unikorn-cloud.org/aggregate-to-{{ $name }}: "true"
    {{- with $rule.roleRefs }}
    roleRefs:
      {{- range . }}
    - {{ include "resource.id" . }}
      {{- end }}
    {{- end }}
    {{- if $rule.flattenToOrganization }}
    flattenToOrganization: true
    {{- end }}
  {{- end }}
  {{- with $scopes := $spec.scopes }}
  scopes:
    {{- with $global := $scopes.global }}
    global:
      {{- range $endpoint, $operations := $global }}
        {{- printf "- name: %s" $endpoint | nindent 4 }}
        {{- printf "operations: [%v]" ($operations | join ", ") | nindent 6 }}
      {{- end }}
    {{- end }}
    {{- with $organization := $scopes.organization }}
    organization:
      {{- range $endpoint, $operations := $organization }}
        {{- printf "- name: %s" $endpoint | nindent 4 }}
        {{- printf "operations: [%v]" ($operations | join ", ") | nindent 6 }}
      {{- end }}
    {{- end }}
    {{- with $project := $scopes.project }}
    project:
      {{- range $endpoint, $operations := $project }}
        {{- printf "- name: %s" $endpoint | nindent 4 }}
        {{- printf "operations: [%v]" ($operations | join ", ") | nindent 6 }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}

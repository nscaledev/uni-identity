# Set the global container repo.
repository: ghcr.io

# Set the global container repo organization.
organization: nscaledev

# Set the global container tag.
# Defaults to the chart revision, which should be in lock-step with the
# actual release.
tag: ~

# Set the image pull secret on the service accounts of all the controllers.
imagePullSecret: ~

# Allows override of the identity service configuration.
server:
  # An array of extra flags to append to the server configuration.
  extraFlags: ~

  # Allows override of the image.
  image: ~

  # Allows resource limits to be set.
  resources:
    limits:
      cpu: '1'
      memory: 1Gi

# Organization controller specifc configuration.
organizationController:
  # Allows override of the image.
  image:

  # Allows resource limits to be set.
  resources:
    limits:
      cpu: 100m
      memory: 100Mi

# Oauth2 client controller specific configuration.
oauth2clientController:
  # Allows override of the image.
  image:

  # Allows resource limits to be set.
  resources:
    limits:
      cpu: 100m
      memory: 100Mi

# Project controller specific configuration.
projectController:
  # Allows override of the image.
  image:

  # Allows resource limits to be set.
  resources:
    limits:
      cpu: 100m
      memory: 100Mi

# Sets the DNS hosts, X.509 certificate subject alternative names and
# oauth2 issuer etc.
identity:
  host: identity.acme.org
  # Auth0 access tokens from this issuer/audience may be exchanged for UNI
  # passports. Leave unset to disable Auth0 token exchange.
  auth0Exchange:
    issuer: ~
    audience: ~

# Issuer related configuration.
issuer:
  # maxTokenDurationDays defines the maximum length of time an issued JWT
  # can last for.  Due to key rotation by cert-manager, the certificate will
  # live twice as long as this value, but refresh at this age, so JWT tokens
  # issued just before the rotation will function for their lifetime (or near
  # enough).
  maxTokenDurationDays: 90

# A static list of registered client applications.
# clients:
#   # Must be a valid Kubernetes resource name.
#   foo:
#     # A redirect URI to return control back to the client.
#     redirectURI: http://app.acme.org
#     # An optional, trusted, login dialog.
#     loginURI: http://app.acme.org/login
#     # An optional, trusted, error dialog.
#     errorURI: http://app.acme.org/error
#     # An optional, trusted, home screen.
#     homeURI: http://app.acme.org

# A static list of registered oauth2 providers.
# providers:
#   # Must be a valid Kubernetes label name.
#   google-identity:
#     # A human readable name, most often used for UIs.
#     description: Google Identity
#     # Must be one of {google,microsoft}
#     type: google
#     # The issuer is usually provided by the oidc provider and will have
#     # a discovery endpoint attached to it at /.well-known/openid-configuration.
#     issuer: https://accounts.google.com
#     # The client ID assigned by the identity provider.
#     clientID: foo.apps.googleusercontent.com
#     # The client secret assigned by the identity provider.
#     clientSecret: something_from_google
#     # The client ID and secret, sourced as a secret.
#     # They must have the keys "id" and "secret",
#     clientSecretName: my-client-secret-secret
#
#   # Preferred replacement for the deprecated --auth0-exchange-issuer /
#   # --auth0-exchange-audience flags. Declare an OAuth2Provider with a
#   # bearerTrust block; the existing template renders it automatically.
#   # The 'type' field is intentionally absent: bearerTrust-only providers
#   # do not participate in the interactive OIDC login flow.
#   auth0-legacy:
#     description: Auth0 bearer-token trust (replaces auth0-exchange flags)
#     issuer: https://your-tenant.auth0.com/
#     bearerTrust:
#       # audience must match the aud claim in the Auth0 access token.
#       audience: https://your-api-audience/
#       # Optional: permit subjects with no UNI user record.
#       # allowExternalIdentity: false
#       # Optional: skip the email_verified check (default: false = require verified).
#       # skipEmailVerification: false
#       # Optional: require the https://unikorn-cloud.org/authz claim (default: false).
#       # requireAuthzClaim: false
#       # Optional: restrict accepted signing algorithms (default: [RS256]).
#       # signingAlgorithms: [RS256]

# platformAdministratorRole is a role that can be implicitly added to users
# and service accounts.
platformAdministrators:
  # Protected role as defined below to grant. Translated verbatim into global
  # role bindings for each subject below, so it is only needed while subjects
  # remain here rather than in globalRoleBindings.
  roles:
  - platform-administrator

  # Subjects the role applies to, must be the canonical name from the IdP
  # and not an alias, in its lower-case form — matching is case-sensitive and
  # the render fails on an upper-case letter.
  subjects: []

# Global role bindings grant the global scopes of the named roles to matched
# subjects, replacing membership resolution for that session. Each entry takes
# exactly one of `subject` or a non-empty `subjects`, plus one or more roles
# defined below. `issuer` is the verbatim `iss` the IdP emits (Auth0: trailing
# slash), or `uni` for locally issued tokens, which allows exact subjects only.
# Subject "*" matches every subject from the issuer and is clamped to read.
# Every other subject is matched case-sensitively, so it must be the
# canonical lower-case form — the render fails on an upper-case letter.
# UNI Group membership never grants global scopes for user accounts. Global
# authority comes only from these bindings, from globalGroupRoleBindings
# below, and from system-account mappings.
# Full semantics: pkg/rbac/README.md#global-role-bindings.
# Helm rejects invalid separators and wildcard bindings on roles that grant any
# non-read global operation — platform-reader is the only role shipped below
# with global scopes that qualifies for wildcard use.
# Rollout ordering: the flag is emitted only when this list is non-empty, and
# older server binaries do not recognise it — deploy a binary that understands
# --global-role-binding before enabling bindings; on rollback, clear this
# value before reverting the binary.
globalRoleBindings: []
#  - issuer: https://staff.example.auth0.com/
#    subject: "*"
#    roles: [platform-reader]
#  - issuer: uni
#    subjects: [alice@example.com, bob@example.com]
#    roles: [platform-administrator]

# Group role bindings grant the FULL global scopes of the named roles. They
# apply to any user authenticated by `issuer` whose token carries `group` in
# that issuer's groupsClaim (see the OAuth2Provider bearerTrust block). The
# issuer must be a CRD-declared provider: the legacy auth0-exchange flags
# cannot carry a groups claim.
# Matching is byte-exact and case-sensitive. Copy the group name from the IdP
# verbatim. Group names are NOT lower-cased, unlike subjects, and Title Case
# is expected. Unlike wildcard subject bindings, these are NOT clamped to
# read.
# Groups exist only on external bearer tokens, so `uni` is not a valid issuer
# here. These bindings consequently act only on direct external bearer usage.
# A staff member who signs in through the UNI interactive login holds a
# UNI-local token with no groups, and never matches a group binding. This
# holds even when that login federates through the same IdP.
# Use these bindings only for issuers whose group namespace is
# administratively controlled. See pkg/rbac/README.md#global-role-bindings.
# Rollout ordering: the chart emits the flag only when this list is non-empty,
# and older server binaries do not recognise it. Deploy a binary that
# understands --global-group-role-binding before you enable bindings. On
# rollback, clear this value before you revert the binary.
# Every downstream service (region, compute, kubernetes, ...) must also run a
# build that vendors an identity middleware with the token-keyed ACL cache
# before you enable any binding here. Older middleware keys ACLs by subject
# only, so such a service can serve a subject's non-elevated token a cached
# group-elevated ACL until that cache entry expires.
globalGroupRoleBindings: []
#  - issuer: https://staff.example.auth0.com/
#    group: Platform Engineering
#    roles: [platform-administrator]

# System accounts map X.509 Common Names to roles.
systemAccounts:
  unikorn-region: region-service
  unikorn-kubernetes: kubernetes-service
  unikorn-compute: compute-service
  uni-storage: storage-service

# A static list of roles.
# Any unscoped API resources are to be managed by the platform operator
# and are assumed to be read only for all.  Global permissions are applied
# regardless of organization or project scoping.  Organization permissions
# are applied to the organization, regardless of project scoping etc.
roles:
  # A platform-admin can do anything anywhere.
  platform-administrator:
    description: Platform administrator
    protected: true
    scopes:
      global:
        identity:organizations: [create,read,update,delete]
        identity:oauth2providers: [create,read,update,delete]
        identity:roles: [create,read,update,delete]
        identity:serviceaccounts: [create,read,update,delete]
        identity:users: [create,read,update,delete]
        identity:groups: [create,read,update,delete]
        identity:projects: [create,read,update,delete]
        identity:projects/references: [create,read,update,delete]
        identity:quotas: [create,read,update,delete]
        identity:allocations: [create,read,update,delete]
        region:regions: [create,read,update,delete]
        region:flavors: [create,read,update,delete]
        region:images: [create,read,update,delete]
        region:externalnetworks: [create,read,update,delete]
        region:identities: [create,read,update,delete]
        region:identities/references: [create,read,update,delete]
        region:networks: [create,read,update,delete]
        region:networks/references: [create,read,update,delete]
        region:networks:v2: [create,read,update,delete]
        region:networks:v2/references: [create,read,update,delete]
        region:loadbalancers:v2: [create,read,update,delete]
        region:securitygroups: [create,read,update,delete]
        region:securitygroups:v2: [create,read,update,delete]
        region:servers: [create,read,update,delete]
        region:servers:v2: [create,read,update,delete]
        region:volumeclasses:v2: [read]
        region:volumes:v2: [create,read,update,delete]
        region:filestorage:v2: [create,read,update,delete]
        region:filestorageclass:v2: [create,read,update,delete]
        region:sshcertificateauthorities:v2: [create,read,delete]
        kubernetes:regions: [create,read,update,delete]
        kubernetes:flavors: [create,read,update,delete]
        kubernetes:images: [create,read,update,delete]
        kubernetes:clustermanagers: [create,read,update,delete]
        kubernetes:clusters: [create,read,update,delete]
        kubernetes:virtualclusters: [create,read,update,delete]
        compute:regions: [create,read,update,delete]
        compute:flavors: [create,read,update,delete]
        compute:images: [create,read,update,delete]
        compute:instances: [create,read,update,delete]
        compute:clusters: [create,read,update,delete]
        storage:objectstorageclasses: [create,read,update,delete]
        storage:objectstorageendpoints: [create,read,update,delete]
        storage:objectstorageendpoints/accesskeys: [create,read,update,delete]
  # A platform-reader has global read-only visibility for support tooling.
  # Definition = read-projection of platform-administrator's global scopes
  # minus credential-bearing and unserved scopes. The projection, the
  # exclusion list, and read-only-ness are pinned by the contract test in
  # pkg/rbac (see docs/platform-reader.md for the audit record and runbook).
  platform-reader:
    description: Platform reader
    protected: true
    scopes:
      global:
        identity:organizations: [read]
        identity:oauth2providers: [read]
        identity:roles: [read]
        identity:serviceaccounts: [read]
        identity:users: [read]
        identity:groups: [read]
        identity:projects: [read]
        identity:quotas: [read]
        identity:allocations: [read]
        region:regions: [read]
        region:flavors: [read]
        region:images: [read]
        region:externalnetworks: [read]
        region:networks: [read]
        region:networks:v2: [read]
        region:loadbalancers:v2: [read]
        region:securitygroups: [read]
        region:securitygroups:v2: [read]
        # uni-region checks read on this scope for the routes that list and get
        # servers. uni-region also checks read on these routes:
        # - GET /api/v2/servers/{id}/sshkey returns the SSH private key.
        # - The v2 console-session route returns a URL that contains a token.
        # - The v2 start, stop, and reboot routes check read, not update.
        # This role therefore permits all of those routes on every server. The
        # grant stays this wide until uni-region moves them to separate scopes.
        region:servers: [read]
        region:volumeclasses:v2: [read]
        region:filestorage:v2: [read]
        region:filestorageclass:v2: [read]
        region:sshcertificateauthorities:v2: [read]
        kubernetes:regions: [read]
        kubernetes:flavors: [read]
        kubernetes:images: [read]
        kubernetes:clustermanagers: [read]
        compute:regions: [read]
        compute:flavors: [read]
        compute:images: [read]
        storage:objectstorageclasses: [read]
        storage:objectstorageendpoints: [read]
  region-service:
    decription: Region service
    protected: true
    scopes:
      global:
        identity:allocations: [create,read,update,delete]
        identity:projects: [read]
        identity:projects/references: [create,delete]
  kubernetes-service:
    description: Kubernetes service
    protected: true
    scopes:
      global:
        identity:projects: [read]
        identity:projects/references: [create,delete]
        identity:allocations: [create,read,update,delete]
        region:identities: [create,read,delete] # TODO: Create/delete V1 only
        region:identities/references: [create,delete] # TODO: V1 only.
        region:regions: [read]
        region:regions/detail: [read] # Gets access to the Kubernetes config for Lite.
        region:flavors: [read]
        region:images: [read]
        region:externalnetworks: [read]
        region:networks: [create,read,delete] # TODO: Create/delete V1 only
  compute-service:
    decription: Compute service
    protected: true
    scopes:
      global:
        identity:projects: [read]
        identity:allocations: [create,read,update,delete]
        region:identities: [create,read,delete] # TODO: V2 delete me, created by network
        region:regions: [read]
        region:flavors: [read]
        region:images: [read,create]
        region:networks: [create,read,delete] # TODO: Create/delete V1 only
        region:networks:v2: [read]
        region:servers: [create,read,update,delete]
        region:servers:v2: [create,read,update,delete]
        region:securitygroups: [create,read,update,delete]
        region:securitygroups:v2: [read]
        region:sshcertificateauthorities:v2: [read]
  storage-service:
    decription: Storage service
    protected: true
    scopes:
      global:
        identity:projects: [read]
        identity:projects/references: [create,delete]
        identity:allocations: [create,read,update,delete]
        region:networks:v2/references: [create,read,update,delete]
  # An administrator can do anything within an organization.
  administrator:
    description: Organization administrator
    scopes:
      organization:
        identity:organizations: [read,update]
        identity:oauth2providers: [create,read,update,delete]
        identity:serviceaccounts: [create,read,update,delete]
        identity:users: [create,read,update,delete]
        identity:roles: [create,read,update,delete]
        identity:groups: [create,read,update,delete]
        identity:projects: [create,read,update,delete]
        identity:quotas: [read]
        region:regions: [read]
        region:networks:v2: [create,read,update,delete]
        region:loadbalancers:v2: [create,read,update,delete]
        region:volumes:v2: [create,read,update,delete]
        region:filestorage:v2: [create,read,update,delete]
        region:filestorageclass:v2: [read]
        region:volumeclasses:v2: [read]
        storage:objectstorageclasses: [read]
        storage:objectstorageendpoints: [create,read,update,delete]
        storage:objectstorageendpoints/accesskeys: [create,read,update,delete]
        region:flavors: [read]
        region:images: [read,create,delete]
        region:securitygroups:v2: [create,read,update,delete]
        region:sshcertificateauthorities:v2: [create,read,delete]
        kubernetes:regions: [read]
        kubernetes:flavors: [read]
        kubernetes:images: [read]
        kubernetes:clusters: [create,read,update,delete]
        kubernetes:virtualclusters: [create,read,update,delete]
        compute:regions: [read]
        compute:flavors: [read]
        compute:images: [read]
        compute:instances: [create,read,update,delete]
        compute:clusters: [create,read,update,delete]
  auditor:
    description: Organization auditor
    scopes:
      organization:
        identity:organizations: [read]
        identity:oauth2providers: [read]
        identity:serviceaccounts: [read]
        identity:users: [read]
        identity:roles: [read]
        identity:groups: [read]
        identity:projects: [read]
        identity:quotas: [read]
        region:regions: [read]
        region:networks:v2: [read]
        region:loadbalancers:v2: [read]
        region:volumes:v2: [read]
        region:filestorage:v2: [read]
        region:filestorageclass:v2: [read]
        region:volumeclasses:v2: [read]
        storage:objectstorageclasses: [read]
        storage:objectstorageendpoints: [read]
        storage:objectstorageendpoints/accesskeys: [read]
        region:flavors: [read]
        region:images: [read]
        region:securitygroups:v2: [read]
        region:sshcertificateauthorities:v2: [read]
        kubernetes:regions: [read]
        kubernetes:flavors: [read]
        kubernetes:images: [read]
        kubernetes:clusters: [read]
        kubernetes:virtualclusters: [read]
        compute:regions: [read]
        compute:flavors: [read]
        compute:images: [read]
        compute:instances: [read]
        compute:clusters: [read]
  # A user can view projects they are a member of and
  # provision clusters.
  user:
    description: Project user
    scopes:
      organization:
        identity:quotas: [read]
        region:regions: [read]
        region:filestorageclass:v2: [read]
        region:volumeclasses:v2: [read]
        storage:objectstorageclasses: [read]
        region:flavors: [read]
        region:images: [read,create,delete]
        kubernetes:regions: [read]
        kubernetes:flavors: [read]
        kubernetes:images: [read]
        compute:regions: [read]
        compute:flavors: [read]
        compute:images: [read]
      project:
        identity:projects: [read]
        region:networks:v2: [create,read,update,delete]
        region:loadbalancers:v2: [create,read,update,delete]
        region:securitygroups:v2: [create,read,update,delete]
        region:volumes:v2: [create,read,update,delete]
        region:filestorage:v2: [create,read,update,delete]
        storage:objectstorageendpoints: [create,read,update,delete]
        storage:objectstorageendpoints/accesskeys: [create,read,update,delete]
        region:sshcertificateauthorities:v2: [create,read,delete]
        kubernetes:clusters: [create,read,update,delete]
        kubernetes:virtualclusters: [create,read,update,delete]
        compute:instances: [create,read,update,delete]
        compute:clusters: [create,read,update,delete]
  # A reader can view projects they are a member of and view
  # kubernetes clusters.
  reader:
    description: Project reader
    scopes:
      organization:
        identity:quotas: [read]
        region:regions: [read]
        region:filestorageclass:v2: [read]
        region:volumeclasses:v2: [read]
        storage:objectstorageclasses: [read]
        region:flavors: [read]
        region:images: [read]
        kubernetes:regions: [read]
        kubernetes:flavors: [read]
        kubernetes:images: [read]
        compute:regions: [read]
        compute:flavors: [read]
        compute:images: [read]
      project:
        identity:projects: [read]
        region:networks:v2: [read]
        region:loadbalancers:v2: [read]
        region:securitygroups:v2: [read]
        region:volumes:v2: [read]
        region:filestorage:v2: [read]
        storage:objectstorageendpoints: [read]
        storage:objectstorageendpoints/accesskeys: [read]
        region:sshcertificateauthorities:v2: [read]
        kubernetes:clusters: [read]
        kubernetes:virtualclusters: [read]
        compute:instances: [read]
        compute:clusters: [read]

# Optional additional roles that can be injected alongside the defaults.
# Shape matches the roles map below. Same names will raise an error.
additionalRoles: {}

# Quota metadata and defaults are defined here.  Quotas are extensible
# so you can create 3rd party quota resources externally.
quotas:
  networks:
    displayName: Networks
    description: Layer 3 networks.
    default: 5
  loadbalancers:
    displayName: Load Balancers
    description: Layer 4 load balancers.
    default: 5
  clusters:
    displayName: Clusters
    description: All cluster types e.g. Kubernetes, compute, etc.
    default: 5
  servers:
    displayName: Servers
    description: All physical and virtual machines.
    default: 10
  gpus:
    displayName: GPUs
    description: General purpose GPUs for AI workloads.
    default: 40
  publicips:
    displayName: Public IPs
    description: Public IP addresses.
    default: 5
  filestorage:
    displayName: File Storage
    description: Persistent network file storage.
    default: 1Ti
    format: binary
  volume:
    displayName: Volume Capacity
    description: Total requested block storage capacity in GiB.
    default: 0
    format: binary

ingress:
  # Sets the ingress class to use.
  class: ~

  # clusterIssuer to use.
  # This defaults to the self-signed CA defined in Unikorn core.
  clusterIssuer: unikorn-issuer

  # If true, will add the external DNS hostname annotation.
  externalDns: false

# Allows CORS to be configured/secured
# cors:
#   # Broswers must send requests from these origin servers, defaults to * if not set.
#   allowOrigin: ['*']
#   # How long to cache the CORS preflight for, mostly useless as browsers override this.
#   maxAge: 86400

# Sets the OTLP endpoint for shipping spans.
# otlpEndpoint: jaeger-collector.default:4318

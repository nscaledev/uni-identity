openapi: 3.0.3
info:
  title: Toy schema
  description: This is a toy schema used for testing.
paths:
  /protected:
    description: Protected endpoint
    get:
      security:
        - oauth2Authentication: []
      responses:
        "200":
          $ref: '#/components/responses/okResponse'
  /upload:
    description: Endpoint for uploads, for which we don't want to examine the request body
    post:
      tags:
        - unikorn-cloud.org/ignore-request-body
      security:
        - oauth2Authentication: []
      requestBody:
        $ref: '#/components/requestBodies/uploadRequest'
      responses:
        "200":
          $ref: '#/components/responses/okResponse'
  /search:
    description: Endpoint with a required query parameter
    get:
      security:
        - oauth2Authentication: []
      parameters:
        - name: needed
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: '#/components/responses/okResponse'
  /token:
    description: Endpoint with a validated request body, used to check error reporting
    post:
      security:
        - oauth2Authentication: []
      requestBody:
        $ref: '#/components/requestBodies/tokenRequest'
      responses:
        "200":
          $ref: '#/components/responses/okResponse'
components:
  securitySchemes:
    oauth2Authentication:
      description: Operation requires OAuth 2.0 bearer token authentication.
      type: oauth2
  requestBodies:
    tokenRequest:
      description: A request with a required property alongside a sensitive one
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            type: object
            required:
              - grant_type
            properties:
              grant_type:
                type: string
              subject_token:
                type: string
                nullable: true
        application/json:
          schema:
            type: object
            required:
              - grant_type
            properties:
              grant_type:
                type: string
              subject_token:
                type: string
                nullable: true
    uploadRequest:
      description: A request to upload data
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - file
            properties:
              file:
                type: string
                format: binary
          encoding:
            file:
              contentType: application/tar+gzip,application/gzip
        application/octet-stream:
          schema:
            type: string
            format: binary
  responses:
    okResponse:
      content:
        text/html: {}

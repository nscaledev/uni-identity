# Transcribed from charts/identity/values.yaml (roles.region-service).
# The metadata.name is a fixed placeholder UUID.
apiVersion: identity.unikorn-cloud.org/v1alpha1
kind: Role
metadata:
  name: 00000000-0000-0000-0000-000000000002
  labels:
    unikorn-cloud.org/name: region-service
spec:
  protected: true
  scopes:
    global:
      - name: identity:allocations
        operations: [create, read, update, delete]

      - name: region:flavors
        operations: [create, read, update, delete]
      - name: region:images
        operations: [create, read, update, delete]
      - name: region:externalnetworks
        operations: [create, read, update, delete]
      - name: region:identities
        operations: [create, read, update, delete]
      - name: region:identities/references
        operations: [create, read, update, delete]
      - name: region:networks
        operations: [create, read, update, delete]
      - name: region:networks/references
        operations: [create, read, update, delete]
      - name: region:networks:v2
        operations: [create, read, update, delete]
      - name: region:networks:v2/references
        operations: [create, read, update, delete]
      - name: region:loadbalancers:v2

# Transcribed from charts/identity/values.yaml (roles.storage-service).
# The metadata.name is a fixed placeholder UUID.
apiVersion: identity.unikorn-cloud.org/v1alpha1
kind: Role
metadata:
  name: 00000000-0000-0000-0000-000000000009
  labels:
    unikorn-cloud.org/name: storage-service
spec:
  protected: true
  scopes:
    global:
      - name: identity:projects
        operations: [read]
      - name: identity:projects/references
        operations: [create, delete]
      - name: identity:allocations
        operations: [create, read, update, delete]
      - name: region:networks:v2/references
        operations: [create, read, update, delete]

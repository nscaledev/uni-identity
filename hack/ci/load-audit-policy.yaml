# kube-apiserver audit policy for the API-call count. Metadata level, identity's
# server ServiceAccount only. One user per install that uses this policy; the
# names come from the install's namespace and release, so keep them in step
# with:
#   - .github/workflows/load-test.yaml (suffix "load")
#   - .github/workflows/integration.yaml (suffix "gate")
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
- RequestReceived
rules:
- level: Metadata
  users:
  - system:serviceaccount:unikorn-identity-load:identity-load-server
  - system:serviceaccount:unikorn-identity-gate:identity-gate-server
- level: None

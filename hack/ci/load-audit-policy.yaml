# kube-apiserver audit policy for the load test. Metadata level, identity's
# server ServiceAccount only. The namespace and release are fixed by
# .github/workflows/load-test.yaml; keep them in step.
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
- RequestReceived
rules:
- level: Metadata
  users:
  - system:serviceaccount:unikorn-identity-load:identity-load-server
- level: None
